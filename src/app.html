<!doctype html>
<html lang="en" class="no-scrollbar">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="description" content="Portfolio of Muhammad Fiqi Firmansyah — Software Engineer crafting digital experiences." />
		<meta property="og:title" content="Fiqi Firmansyah — Software Engineer" />
		<meta property="og:description" content="Crafting digital experiences. Software engineering and machine learning portfolio." />
		<meta property="og:type" content="website" />
		<meta property="og:url" content="https://fiqifirmansyah.vercel.app" />
		<script>
			// IMMEDIATE scroll prevention - runs before any rendering
			(function() {
				// Prevent browser scroll restoration
				if ('scrollRestoration' in history) {
					history.scrollRestoration = 'manual';
				}
				
				// Force scroll to top multiple times to catch race conditions
				window.scrollTo(0, 0);
				
				// Also prevent any scroll events during initial load
				var preventScroll = function(e) {
					window.scrollTo(0, 0);
					e.preventDefault();
					return false;
				};
				
				window.addEventListener('scroll', preventScroll, { passive: false });
				
				// Remove the prevention after a short delay
				setTimeout(function() {
					window.removeEventListener('scroll', preventScroll);
				}, 500);
			})();
		</script>
		<style>
			/* Hide content initially to prevent flash of footer */
			html {
				scroll-behavior: auto !important;
			}
			body {
				overflow: hidden !important;
			}
			/* Re-enable after loading */
			body.loaded {
				overflow: auto !important;
			}
		</style>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
		<noscript>
			<div style="display:flex;align-items:center;justify-content:center;height:100vh;background:#0c0c0b;color:#e8e8e4;font-family:sans-serif;text-align:center;padding:2rem;">
				<div>
					<h1 style="font-size:2rem;margin-bottom:1rem;">JavaScript Required</h1>
					<p style="opacity:0.6;">This portfolio requires JavaScript for animations and interactivity. Please enable JavaScript to view the full experience.</p>
				</div>
			</div>
		</noscript>
	</body>
</html>
